name: Auto Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run build

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy-package
          
          # 1. Copy standalone server
          if [ -d ".next/standalone" ]; then
            cp -r .next/standalone/* deploy-package/
          fi
          
          # 2. Copy static assets to .next/static
          mkdir -p deploy-package/.next
          if [ -d ".next/static" ]; then
            cp -r .next/static deploy-package/.next/
          fi
          
          # 3. Copy compiled HTML pages for direct Apache web serving
          if [ -d ".next/server/app" ]; then
            find .next/server/app -type f -name "*.html" -exec cp {} deploy-package/ \;
            # Copy nested page structures
            cp -r .next/server/app/* deploy-package/ 2>/dev/null || true
          fi
          
          # 4. Copy public folder assets (logo, images, SVGs)
          cp -r public/* deploy-package/ 2>/dev/null || true
          
          # 5. Copy .htaccess for Apache DirectoryIndex & routing
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess deploy-package/.htaccess
          fi
          
          # 6. Production package.json
          cp package.json deploy-package/

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./deploy-package/
          server-dir: ./
          dangerous-clean-slate: false
